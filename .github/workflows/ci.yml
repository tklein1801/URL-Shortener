name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            apps/server/go.sum
            apps/cli/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l apps/server apps/cli)"
      - name: Vet
        run: go vet ./apps/server/... ./apps/cli/...
      - name: Test with race detector
        run: go test -race ./apps/server/... ./apps/cli/...
      - name: Build server container
        run: docker build -t url-shortener-server:test apps/server
