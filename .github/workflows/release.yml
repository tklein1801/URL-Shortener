name: Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  build:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64, arm]
        exclude:
          - goos: darwin
            goarch: arm
          - goos: windows
            goarch: arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: apps/cli/go.sum
      - name: Build CLI
        working-directory: apps/cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          EXT: ${{ matrix.goos == 'windows' && '.exe' || '' }}
        run: |
          mkdir -p artifacts
          go build -trimpath -ldflags "-s -w -X main.version=$RELEASE_VERSION" -o "artifacts/surl_${GOOS}_${GOARCH}${EXT}" .
      - uses: actions/upload-artifact@v7
        with:
          name: surl_${{ matrix.goos }}_${{ matrix.goarch }}
          path: apps/cli/artifacts/*
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/* --verify-tag --generate-notes --title "$RELEASE_TAG"
