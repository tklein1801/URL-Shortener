platform: linux

image_resource:
  type: registry-image
  source:
    repository: golang
    tag: "1.27.1"

inputs:
  - name: repo

run:
  path: sh
  user: "65532"
  args:
    - -eu
    - -c
    - |
      export CGO_ENABLED=1
      export GOCACHE=/tmp/go-build
      export GOMODCACHE=/tmp/go-mod
      mkdir -p "$GOCACHE" "$GOMODCACHE"
      cd repo
      find apps/server apps/cli -type f -name '*.go' -print | while IFS= read -r file; do
        normalized="/tmp/gofmt-$(printf '%s' "$file" | tr '/\\' '__')"
        tr -d '\r' < "$file" > "$normalized"
        diff="$(gofmt -d "$normalized")"
        test -z "$diff"
      done
      go vet ./apps/server/... ./apps/cli/...
      go test -race -count=1 ./apps/server/... ./apps/cli/...
