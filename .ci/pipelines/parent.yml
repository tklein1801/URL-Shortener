resource_types:
  - name: cogito
    type: registry-image
    source:
      repository: pix4d/cogito@sha256:a78e2cbc21785efb4a078fd26ae1c2ed2737bb6ee7498d899610fd7b1828fce1
  - name: pull-request
    type: registry-image
    source:
      repository: teliaoss/github-pr-resource
      tag: latest
  - name: github-release
    type: registry-image
    source:
      repository: concourse/github-release-resource
      tag: '1.14'

resources:
  - name: branches
    type: git
    icon: source-branch-sync
    check_every: 30m
    source:
      version_type: branches
      uri: git@github.com:((repo_owner))/((repo_name)).git
      private_key: ((github.private_key))
      branch_filters:
        - feat/*
        - feature/*
        - fix/*
        - refactor/*

  - name: repo
    type: git
    icon: git
    check_every: 1m
    source:
      uri: git@github.com:((repo_owner))/((repo_name)).git
      branch: main
      private_key: ((github.private_key))

  - name: gh-status
    type: cogito
    check_every: never
    icon: list-status
    source:
      owner: ((repo_owner))
      repo: ((repo_name))
      access_token: ((github.status_token))
      context_prefix: concourse

  - name: pr-main
    type: pull-request
    check_every: 1m
    icon: source-pull
    source:
      repository: ((repo_owner))/((repo_name))
      access_token: ((github.status_token))
      base_branch: main

  - name: gh-release
    type: github-release
    check_every: never
    icon: party-popper
    source:
      owner: ((repo_owner))
      repository: ((repo_name))
      access_token: ((github.release_token))
      release: false
      pre_release: true

  - name: server-image
    type: registry-image
    check_every: never
    icon: docker
    source:
      repository: ghcr.io/((repo_owner))/((repo_name))-server
      tag: latest
      username: ((repo_owner))
      password: ((github.registry_token))

  - name: golang
    type: registry-image
    icon: si/go
    source:
      repository: golang
      tag: '1.27.1'

jobs:
  - name: set-feature-pipelines
    public: true
    serial: true
    plan:
      - in_parallel:
          - get: branches
            trigger: true
          - get: repo
            trigger: true
      - load_var: branches
        file: branches/branches.json
      - across:
          - var: branch
            values: ((.:branches))
        do:
          - set_pipeline: url-shortener-branches
            file: repo/.ci/pipelines/template.yml
            vars:
              repo_uri: ((git.uri))
              repo_owner: ((repo_owner))
              repo_name: ((repo_name))
              github_private_key: ((github.private_key))
              status_token: ((github.status_token))
              go_image: golang
              go_version: '1.27.1'
            instance_vars:
              branch: ((.:branch))

  - name: main-ci-release
    public: true
    serial: true
    plan:
      - get: repo
        trigger: true
        version: every
      - get: golang
      - put: gh-status
        inputs: [repo]
        params:
          state: pending
          context: ci
      - task: checks
        file: repo/.ci/tasks/checks.yml
        image: golang
        input_mapping: { repo: repo }
      - task: build
        file: repo/.ci/tasks/build.yml
        image: golang
        input_mapping: { repo: repo }
        params:
          RELEASE_PREFIX: main
      - do:
          - put: gh-status
            inputs: [repo]
            params:
              state: pending
              context: release
          - task: build-server-image
            privileged: true
            file: repo/.ci/tasks/server-image.yml
            input_mapping: { repo: repo }
            output_mapping: { image: server-image-build }
          - in_parallel:
              - put: gh-release
                inputs: [artifacts, release-metadata]
                params:
                  name: release-metadata/name
                  tag: release-metadata/tag
                  commitish: release-metadata/commitish
                  generate_release_notes: true
                  globs:
                    - artifacts/surl_*
                    - artifacts/SHA256SUMS
              - put: server-image
                inputs: [server-image-build, release-metadata]
                params:
                  image: server-image-build/image
                  additional_tags: release-metadata/tag
                get_params: { skip_download: true }
        on_success:
          put: gh-status
          inputs: [repo]
          params: { state: success, context: release }
        on_failure:
          put: gh-status
          inputs: [repo]
          params: { state: failure, context: release }
        on_error:
          put: gh-status
          inputs: [repo]
          params: { state: error, context: release }
        on_abort:
          put: gh-status
          inputs: [repo]
          params: { state: abort, context: release }
    on_success:
      put: gh-status
      inputs: [repo]
      params: { state: success, context: ci }
    on_failure:
      put: gh-status
      inputs: [repo]
      params: { state: failure, context: ci }
    on_error:
      put: gh-status
      inputs: [repo]
      params: { state: error, context: ci }
    on_abort:
      put: gh-status
      inputs: [repo]
      params: { state: abort, context: ci }

  - name: pr-main
    public: true
    serial: true
    plan:
      - get: pr-main
        trigger: true
        version: every
        params:
          integration_tool: merge
      - do:
          - put: pr-main-status
            resource: pr-main
            inputs: [pr-main]
            params:
              path: pr-main
              status: pending
              base_context: concourse
              context: pr-main
            get_params: { skip_download: true }
          - get: golang
          - task: checks
            file: pr-main/.ci/tasks/checks.yml
            image: golang
            input_mapping: { repo: pr-main }
          - task: build
            file: pr-main/.ci/tasks/build.yml
            image: golang
            input_mapping: { repo: pr-main }
            params:
              RELEASE_PREFIX: pr
        on_success:
          put: pr-main-status
          resource: pr-main
          inputs: [pr-main]
          params:
            path: pr-main
            status: success
            base_context: concourse
            context: pr-main
          get_params: { skip_download: true }
        on_failure:
          put: pr-main-status
          resource: pr-main
          inputs: [pr-main]
          params:
            path: pr-main
            status: failure
            base_context: concourse
            context: pr-main
          get_params: { skip_download: true }
        on_error:
          put: pr-main-status
          resource: pr-main
          inputs: [pr-main]
          params:
            path: pr-main
            status: error
            base_context: concourse
            context: pr-main
          get_params: { skip_download: true }
        on_abort:
          put: pr-main-status
          resource: pr-main
          inputs: [pr-main]
          params:
            path: pr-main
            status: error
            base_context: concourse
            context: pr-main
          get_params: { skip_download: true }
