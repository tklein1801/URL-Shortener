services:
  server:
    build:
      context: ./apps/server
    restart: unless-stopped
    environment:
      SQLITE_PATH: /data/links.db
      MASTER_TOKEN_FILE: /data/master-token
      PORT: "3000"
      HTTP_READ_TIMEOUT: 10s
      HTTP_WRITE_TIMEOUT: 15s
      HTTP_IDLE_TIMEOUT: 60s
      SHUTDOWN_TIMEOUT: 10s
      BACKEND_TIMEOUT: 5s
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - server-token:/data

volumes:
  server-token:
