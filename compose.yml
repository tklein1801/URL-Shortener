services:
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - redis-data:/data

  server:
    build:
      context: ./apps/server
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis:6379
      REDIS_DB: "0"
      MASTER_TOKEN_FILE: /data/master-token
      PORT: "3000"
      HTTP_READ_TIMEOUT: 10s
      HTTP_WRITE_TIMEOUT: 15s
      HTTP_IDLE_TIMEOUT: 60s
      SHUTDOWN_TIMEOUT: 10s
      BACKEND_TIMEOUT: 5s
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - server-token:/data

volumes:
  redis-data:
  server-token:
